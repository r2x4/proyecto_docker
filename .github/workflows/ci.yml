name: CI Docker Node

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Instalar dependencias
        run: npm install

      - name: Verificar Docker
        run: docker --version

      - name: Verificar Docker Compose
        run: docker compose version

      - name: Validar archivo docker-compose
        run: docker compose config

      - name: Construir imagen Docker
        run: docker build -t proyecto-docker-app .

      - name: Levantar contenedores con Docker Compose
        run: docker compose up -d

      - name: Verificar contenedores activos
        run: docker ps -a

      - name: Detener contenedores
        run: docker compose down

      - name: Finalizar validación
        run: echo "Integración continua ejecutada correctamente con GitHub Actions"